name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build on Ubuntu
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            autoconf \
            automake \
            libtool \
            gettext \
            pkg-config \
            libjpeg-dev \
            libmicrohttpd-dev \
            libfftw3-dev \
            libavutil-dev \
            libavformat-dev \
            libavcodec-dev \
            libswscale-dev \
            libswresample-dev \
            libavdevice-dev \
            autopoint

      - name: Generate build system
        run: autoreconf -fiv

      - name: Configure
        run: ./configure

      - name: Build
        run: make -j"$(nproc)"

